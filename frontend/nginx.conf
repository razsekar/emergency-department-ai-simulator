server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Server-Sent Events (streaming AI responses) need buffering off.
    proxy_buffering off;
    # Agent, demo and comparison requests wait for the model: a CPU Ollama answer takes 5-7 minutes and a
    # comparison calls several models one after another. 300s caused HTTP 504 in the real UI.
    proxy_read_timeout 3600s;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
